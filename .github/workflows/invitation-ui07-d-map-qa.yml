name: Invitation UI-07-D map controls and directions QA

on:
  pull_request:
    paths:
      - src/app/_components/public-invitations/wedding/gyeol/LocationMap.tsx
      - src/app/_components/public-invitations/wedding/gyeol/LocationMap.module.css
      - src/app/_components/public-invitations/wedding/WeddingActionIcon.tsx
      - src/app/sample-invitation/**
      - scripts/test-wedding-ui07-d.mts
      - scripts/qa-invitation-ui07-d.py
      - .github/workflows/invitation-ui07-d-map-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  map-visual-synthetic-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install web dependencies and Chromium
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate map source contracts and QA isolation
        run: node scripts/run-test-suite.mjs test-wedding-ui07-d
      - name: Start development-only fictional wedding sample
        env:
          NEXT_PUBLIC_USE_FIREBASE: 'false'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          nohup npm run dev > "$RUNNER_TEMP/ui07-d-next.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:3000/sample-invitation/?qaTheme=simple&qaUI07=1&qaUI07Map=coordinates&embed=1"
          for _ in range(100):
              try:
                  with urllib.request.urlopen(url, timeout=12) as response:
                      if response.status == 200:
                          print("UI-07-D fictional sample ready", flush=True)
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Synthetic wedding sample did not become ready")
          PY
      - name: Verify 5 themes, viewport ratios, map state, route actions and 200 percent font
        env:
          INVITATION_UI07D_BASE: http://127.0.0.1:3000
        run: python scripts/qa-invitation-ui07-d.py
      - name: Upload screenshots, state metrics and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-ui07-d-synthetic-map-evidence
          path: artifacts/ui-07-d/
          retention-days: 30
          if-no-files-found: warn
      - name: Show Next diagnostics on failure
        if: failure()
        run: tail -100 "$RUNNER_TEMP/ui07-d-next.log" || true
