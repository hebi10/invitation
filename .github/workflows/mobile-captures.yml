name: Android 화면 캡처

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: 'Exact frozen main commit SHA for the Android capture batch'
        type: string
        required: true

permissions:
  contents: read

jobs:
  validate-source:
    name: 검증 대상 main SHA 확인
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 최종 main 커밋 일치 확인
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::최종 Android QA는 main에서만 실행"; exit 1; }
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_MAIN_SHA" == "$GITHUB_SHA" ]] || { echo "::error::최종 커밋 SHA 불일치"; exit 1; }
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" == "$GITHUB_SHA" ]] || { echo "::error::main 변경 감지"; exit 1; }

  capture:
    needs: validate-source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 모바일 의존성 설치
        run: |
          npm ci
          npm ci --prefix apps/mobile
      - name: KVM 접근 설정
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 실제 Android 앱 실행 및 캡처
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 scripts/capture-mobile-android.py
      - name: 캡처와 진단 자료 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-captures
          path: artifacts/mobile-android/
          if-no-files-found: warn
          retention-days: 14
