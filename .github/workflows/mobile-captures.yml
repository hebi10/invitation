name: Android 화면 캡처

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-captures.yml'
      - 'scripts/capture-live-wedding-themes.py'
      - 'scripts/capture-mobile-android.py'
      - 'scripts/fixtures/mobile-editor-capture.tsx.fixture'
      - 'scripts/fixtures/mobile-modals-capture.tsx.fixture'
      - 'scripts/fixtures/mobile-owned-list-capture.tsx.fixture'
      - 'scripts/fixtures/mobile-linked-list-capture.tsx.fixture'
      - 'scripts/fixtures/mobile-system-capture.tsx.fixture'
      - 'scripts/fixtures/mobile-account-login-capture.tsx.fixture'
      - 'scripts/fixtures/mobile-recent-status-capture.tsx.fixture'
      - 'scripts/fixtures/mobile-keyboard-capture.tsx.fixture'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'qa/invitation-live-theme-captures-')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 모바일 의존성 설치
        run: |
          npm ci
          npm ci --prefix apps/mobile
      - name: KVM 접근 설정
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 실제 Android 앱 실행 및 캡처
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 scripts/capture-mobile-android.py
      - name: 캡처와 진단 자료 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-captures
          path: artifacts/mobile-android/
          if-no-files-found: warn
          retention-days: 14

  public-invitation-themes:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'qa/invitation-live-theme-captures-')
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only capture browser
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Capture five live public wedding themes
        run: python scripts/capture-live-wedding-themes.py
      - name: Archive captured pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-shin-minje-5theme-fullpages
          path: artifacts/live-wedding-theme-captures/
          if-no-files-found: error
          retention-days: 14
