name: DEX-03 Invitation release QA

on:
  push:
    branches: [codex/dex03-invitation-record-qa]

permissions:
  contents: read
  actions: read

jobs:
  invitation-release-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_NO_DOTENV: '1'
      EXPO_ANDROID_VERSION_CODE: '30511'
      CANDIDATE_SHA: d44049e6b74efc2337339949e84c6c33077a77e4
      BASELINE_SHA: be0a976cd91060a4e1b41a176d5d6c6675164c14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate checkout and extract QA tools
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git show "$GITHUB_SHA:.github/ci/dex03-invitation-qa.py" > "$RUNNER_TEMP/dex03-invitation-qa.py"
          mkdir -p "$RUNNER_TEMP/invitation-dex03"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - run: npm ci --include=dev
      - run: npm ci --include=dev
        working-directory: apps/mobile
      - name: Generate production launcher assets
        run: |
          python -m pip install Pillow==12.3.0
          python scripts/build-store-rebrand.py --icon-only
      - name: Clean Android prebuild and verify release configuration
        working-directory: apps/mobile
        run: |
          npx --no-install expo prebuild --platform android --clean --no-install
          grep -Fx 'android.enableMinifyInReleaseBuilds=true' android/gradle.properties
          grep -Fx 'android.enableShrinkResourcesInReleaseBuilds=true' android/gradle.properties
          grep -F 'proguard-android-optimize.txt' android/app/build.gradle
          grep -Fx -- '-keep @interface expo.modules.kotlin.records.Field { *; }' android/app/proguard-rules.pro
          GITHUB_SHA="$CANDIDATE_SHA" node ../../scripts/mobile-release-policy.mjs prepare android/app/build.gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned Android release for all configured ABIs
        working-directory: apps/mobile
        run: |
          timeout 45m bash android/gradlew -p android --no-daemon --max-workers=2 :app:assembleRelease :app:bundleRelease
          test -s android/app/build/outputs/bundle/release/app-release.aab
          test -s android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Download historical unsigned build for exact DEX baseline
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          run-id: 45736405437
          name: invitation-1.0.5-code30511-be0a976cd910-unsigned
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/invitation-baseline
      - name: Verify R8 compiler, mapping and DEX measurements
        id: metrics
        run: python "$RUNNER_TEMP/dex03-invitation-qa.py" metrics
      - name: Sign disposable emulator APK with QA-only key
        working-directory: apps/mobile
        run: |
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          qa_dir="$RUNNER_TEMP/invitation-dex03"
          apksigner="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          keytool -genkeypair -keystore "$RUNNER_TEMP/dex03-qa.jks" -storepass android -keypass android \
            -alias dex03qa -keyalg RSA -keysize 2048 -validity 30 -dname 'CN=DEX 03 emulator QA'
          "$apksigner" sign --ks "$RUNNER_TEMP/dex03-qa.jks" --ks-pass pass:android --key-pass pass:android \
            --out "$qa_dir/invitation-dex03-qa.apk" "$apk"
          "$apksigner" verify --verbose "$qa_dir/invitation-dex03-qa.apk"
          rm -f "$RUNNER_TEMP/dex03-qa.jks" "$qa_dir/invitation-dex03-qa.apk.idsig"
      - name: Preserve DEX measurements, mapping, and emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: invitation-${{ steps.metrics.outputs.candidate_bytes }}-dex-bytes-from-${{ steps.metrics.outputs.baseline_bytes }}
          path: ${{ runner.temp }}/invitation-dex03/
          if-no-files-found: error
          retention-days: 7
      - name: Enable runner KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install release APK and exercise home, creation gate, account screen and relaunch
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_7_pro
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python "$RUNNER_TEMP/dex03-invitation-qa.py" smoke
      - name: Preserve emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-dex03-emulator-evidence
          path: ${{ runner.temp }}/invitation-dex03-smoke/
          if-no-files-found: ignore
          retention-days: 7
