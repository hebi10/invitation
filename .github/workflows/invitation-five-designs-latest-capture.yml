name: Invitation current five public wedding designs screenshots (read-only)

on:
  push:
    branches:
      - qa/invitation-five-themes-current-screens-20261110
    paths:
      - scripts/qa-invitation-five-live-designs-capture.py
      - .github/workflows/invitation-five-designs-latest-capture.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-five-real-public-weddings:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Chromium and Pillow
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
      - name: Capture actual five public wedding designs and sections
        env:
          INVITATION_CAPTURE_BASE_URL: https://invite.msgnote.kr/shin-minje-kim-hyunji
        run: python scripts/qa-invitation-five-live-designs-capture.py
      - name: Upload all screenshots plus diagnostic manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-five-current-public-designs-20261110
          path: artifacts/invitation-current-five-themes-20261110/
          retention-days: 30
          if-no-files-found: warn
