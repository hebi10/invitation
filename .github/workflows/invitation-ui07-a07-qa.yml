name: Invitation UI-07-A-07 responsive and accessibility QA

on:
  pull_request:
    paths:
      - src/app/sample-invitation/**
      - src/app/_components/public-invitations/wedding/**
      - src/components/sections/GiftInfo/**
      - src/components/sections/Guestbook/**
      - scripts/qa-invitation-ui07-a07.py
      - scripts/test-wedding-ui07-a07.mts
      - scripts/run-test-suite.mjs
      - .github/workflows/invitation-ui07-a07-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a07-fictional-responsive-accessibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install web dependencies and Chromium
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate A-07 source and dev-fixture isolation
        run: npx --yes tsx scripts/test-wedding-ui07-a07.mts
      - name: Start fictional local sample without Firebase credentials
        env:
          NEXT_PUBLIC_USE_FIREBASE: 'false'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          nohup npm run dev > "$RUNNER_TEMP/invitation-a07-next.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:3000/sample-invitation/?qaTheme=emotional&qaUI07=1&qaUI07Case=long&embed=1"
          for _ in range(110):
              try:
                  with urllib.request.urlopen(url, timeout=12) as response:
                      if response.status == 200:
                          print("UI-07-A-07 fictional fixture ready", flush=True)
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("UI-07-A-07 fictional fixture did not start")
          PY
      - name: Capture 25 viewports, 20 edge cases and 10 text-zoom cases
        env:
          INVITATION_LOCAL_BASE: http://127.0.0.1:3000
        run: python scripts/qa-invitation-ui07-a07.py
      - name: Preserve screenshots, SHA256 and accessibility metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-ui07-a07-fictional-responsive-a11y
          path: artifacts/ui-07-a07/
          retention-days: 30
          if-no-files-found: warn
      - name: Print local Next.js diagnostics on failure
        if: failure()
        run: tail -100 "$RUNNER_TEMP/invitation-a07-next.log" || true
