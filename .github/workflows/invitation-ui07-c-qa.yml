name: Invitation UI-07-C family contacts and calendar QA

on:
  pull_request:
    paths:
      - src/app/_components/public-invitations/wedding/WeddingBase.tsx
      - src/app/_components/public-invitations/wedding/WeddingBase.module.css
      - src/app/_components/public-invitations/wedding/WeddingCalendarDownload.tsx
      - src/app/_components/public-invitations/wedding/WeddingCalendarDownload.module.css
      - scripts/test-wedding-ui07-c.mts
      - scripts/qa-invitation-ui07-c.py
      - .github/workflows/invitation-ui07-c-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contacts-calendar-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Next.js and Chromium
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate family contact and calendar contracts
        run: node scripts/run-test-suite.mjs test-wedding-ui07-c
      - name: Launch isolated synthetic page
        env:
          NEXT_PUBLIC_USE_FIREBASE: 'false'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          nohup npm run dev > "$RUNNER_TEMP/ui07-c-next.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:3000/sample-invitation/?qaTheme=simple&qaUI07=1&embed=1"
          for _ in range(100):
              try:
                  with urllib.request.urlopen(url, timeout=12) as response:
                      if response.status == 200:
                          print("UI-07-C fictional page ready", flush=True)
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("UI-07-C fictional page not ready")
          PY
      - name: Validate 5 themes, contact groups, ICS export, inline disclosure and text scaling
        env:
          INVITATION_UI07C_BASE: http://127.0.0.1:3000
        run: python scripts/qa-invitation-ui07-c.py
      - name: Save screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-ui07-c-contact-calendar-evidence
          path: artifacts/ui-07-c/
          retention-days: 30
          if-no-files-found: warn
      - name: Print local Next.js diagnostics on failure
        if: failure()
        run: tail -100 "$RUNNER_TEMP/ui07-c-next.log" || true
