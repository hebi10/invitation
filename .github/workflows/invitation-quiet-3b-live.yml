name: Invitation 3-B live Quiet Invitation deployment verification

on:
  push:
    branches:
      - main
    paths:
      - scripts/qa-invitation-quiet-3b-live.py
      - .github/workflows/invitation-quiet-3b-live.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-readonly-smoke:
    if: github.repository == 'hebi10/invitation'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install read-only Chromium QA
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Confirm served Quiet Intro 3 styles and 5 real public weddings
        env:
          INVITATION_3B_LIVE_BASE: https://invite.msgnote.kr
        run: python scripts/qa-invitation-quiet-3b-live.py
      - name: Preserve public screenshot and evidence manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-3b-live-quiet-intro-release-smoke
          path: artifacts/quiet-invitation-3b-live/
          retention-days: 30
          if-no-files-found: warn
