name: Invitation INTRO-GIF-02-A picker browser QA

on:
  pull_request:
    paths:
      - src/lib/invitationIntroCatalog.ts
      - src/components/sections/InvitationIntro/**
      - src/app/intro-catalog-preview/**
      - scripts/test-invitation-intro-catalog.mts
      - scripts/qa-invitation-intro-gif-02a.py
      - .github/workflows/invitation-intro-gif-02a-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  intro-catalog-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Next.js and Chromium
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify data registry, asset hash and server HTML without requiring customer data
        run: node scripts/run-test-suite.mjs test-invitation-intro-catalog
      - name: Launch development-only isolated catalog preview
        env:
          NEXT_PUBLIC_USE_FIREBASE: 'false'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          nohup npm run dev > "$RUNNER_TEMP/intro-catalog-next.log" 2>&1 &
          python - <<'PY'
          import time
          import urllib.request
          url = "http://127.0.0.1:3000/intro-catalog-preview/"
          for _ in range(100):
              try:
                  with urllib.request.urlopen(url, timeout=12) as result:
                      if result.status == 200:
                          print("Dev-only intro catalog fixture available")
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Intro catalog fixture unavailable")
          PY
      - name: Test selection, preview, replay, focus, reduced motion and failure fallback
        run: python scripts/qa-invitation-intro-gif-02a.py
      - name: Upload screenshots and SHA256 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-intro-gif-02a-picker-evidence
          path: artifacts/intro-gif-02a/
          retention-days: 30
          if-no-files-found: warn
      - name: Log isolated app diagnostics on failure
        if: failure()
        run: tail -120 "$RUNNER_TEMP/intro-catalog-next.log" || true
