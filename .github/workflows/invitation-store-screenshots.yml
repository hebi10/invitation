name: Invitation Play store screenshots (ko-KR)

on:
  pull_request:
    paths:
      - 'store-assets/invitation/ko-KR/**'
      - 'scripts/publish-play-screenshots.py'
      - 'scripts/build-store-rebrand.py'
      - '.github/workflows/invitation-store-screenshots.yml'
  workflow_dispatch:
    inputs:
      ops06_store_approved:
        description: 'Separate confirmed Play listing update after all development and QA'
        required: true
        type: boolean
        default: false
      ops06_confirmation:
        description: 'For apply type APPLY_VERIFIED_PLAY_STORE_ASSETS'
        type: string
        required: false
      ops06_expected_main_sha:
        description: 'Approved exact current main SHA'
        type: string
        required: false
      ops06_batch_id:
        description: 'KST release batch YYYY-MM-DD-invitation'
        type: string
        required: false
      ops01_release_approved:
        description: 'Approve Play changes only after final release batch and QA'
        type: boolean
        required: true
        default: false
      apply:
        description: 'Upload the approved eight ko-KR phone screenshots using Play WIF'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: invitation-ko-kr-phone-screenshots
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Korean screenshot rendering dependencies
        run: |
          python -m pip install Pillow==12.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
      - name: Build flat editorial images from original verified app screenshots
        run: python scripts/build-store-rebrand.py --screenshots-only
      - name: Verify generated original-source screenshots and SHA-256 manifest
        run: python scripts/publish-play-screenshots.py --assets artifacts/store-refresh/ko-KR
      - name: Verify deterministic flat launcher and Play icons
        run: |
          python scripts/build-store-rebrand.py --icon-only
          python - <<'PY'
          import hashlib
          from PIL import Image
          from pathlib import Path
          expected = "ae67ec95fffe8e2b03afcdb0dc9f6c0d0507ea3f0a6a0b30d114b54eec435486"
          for path in (Path("apps/mobile/store/icon.png"), Path("apps/mobile/store/ko-KR/icon.png")):
              with Image.open(path) as img:
                  assert img.size == (512, 512)
                  assert hashlib.sha256(img.convert("RGBA").tobytes()).hexdigest() == expected
          PY

  upload:
    if: >-
      github.repository == 'hebi10/invitation' && github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.apply == true &&
      inputs.ops01_release_approved == true && inputs.ops06_store_approved == true
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: google-play-testing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Korean screenshot rendering dependencies
        run: |
          python -m pip install Pillow==12.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
      - name: Build flat editorial images from original verified app screenshots
        run: python scripts/build-store-rebrand.py --screenshots-only
      - name: Verify generated original-source screenshots and SHA-256 manifest
        run: python scripts/publish-play-screenshots.py --assets artifacts/store-refresh/ko-KR
      - name: Preserve exact rendered images for visual review
        uses: actions/upload-artifact@v4
        with:
          name: invitation-20261109-flat-editorial-screenshots
          path: artifacts/store-refresh/ko-KR/
          retention-days: 30
      - name: OPS-06 verify store listing approval and current main
        env:
          GH_TOKEN: ${{ github.token }}
          OPS06_STORE_APPROVED: ${{ inputs.ops06_store_approved }}
          OPS06_CONFIRMATION: ${{ inputs.ops06_confirmation }}
          OPS06_EXPECTED_MAIN_SHA: ${{ inputs.ops06_expected_main_sha }}
          OPS06_BATCH_ID: ${{ inputs.ops06_batch_id }}
        run: python3 scripts/ops06/store_gate.py apply
      - name: Authenticate Google Play using short-lived Workload Identity token
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload only ko-KR phoneScreenshots within transactional Play edit
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/publish-play-screenshots.py --assets artifacts/store-refresh/ko-KR --publish
      - name: Preserve upload report, including previous image IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-ko-kr-phone-screenshots-upload-report
          path: artifacts/play-store-screenshots/report.json
          if-no-files-found: warn
          retention-days: 30
