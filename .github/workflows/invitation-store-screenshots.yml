name: Invitation Play store screenshots (ko-KR)

on:
  pull_request:
    paths:
      - 'store-assets/invitation/ko-KR/**'
      - 'scripts/publish-play-screenshots.py'
      - 'scripts/build-store-rebrand.py'
      - '.github/workflows/invitation-store-screenshots.yml'
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      apply:
        description: 'Upload the approved eight ko-KR phone screenshots using Play WIF'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: invitation-ko-kr-phone-screenshots
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Korean screenshot rendering dependencies
        run: |
          python -m pip install Pillow==12.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
      - name: Build flat editorial images from original verified app screenshots
        run: python scripts/build-store-rebrand.py --screenshots-only
      - name: Verify generated original-source screenshots and SHA-256 manifest
        run: python scripts/publish-play-screenshots.py --assets artifacts/store-refresh/ko-KR
      - name: Verify deterministic flat launcher and Play icons
        run: |
          python scripts/build-store-rebrand.py --icon-only
          python - <<'PY'
          import hashlib
          from PIL import Image
          from pathlib import Path
          expected = "ae67ec95fffe8e2b03afcdb0dc9f6c0d0507ea3f0a6a0b30d114b54eec435486"
          for path in (Path("apps/mobile/store/icon.png"), Path("apps/mobile/store/ko-KR/icon.png")):
              with Image.open(path) as img:
                  assert img.size == (512, 512)
                  assert hashlib.sha256(img.convert("RGBA").tobytes()).hexdigest() == expected
          PY

  dispatch:
    if: >
      github.event_name == 'issue_comment' &&
      github.repository == 'hebi10/invitation' &&
      github.event.issue.number == 30 &&
      github.event.comment.user.login == 'hebi10' &&
      github.event.comment.body == '/upload-invitation-screenshots-20261108'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch trusted main-only Play upload run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/invitation-store-screenshots.yml/dispatches" \
            -f ref=main \
            -f 'inputs[apply]=true'

  upload:
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'hebi10/invitation' &&
      inputs.apply == true
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: google-play-testing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare Korean screenshot rendering dependencies
        run: |
          python -m pip install Pillow==12.3.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-nanum
      - name: Build flat editorial images from original verified app screenshots
        run: python scripts/build-store-rebrand.py --screenshots-only
      - name: Verify generated original-source screenshots and SHA-256 manifest
        run: python scripts/publish-play-screenshots.py --assets artifacts/store-refresh/ko-KR
      - name: Preserve exact rendered images for visual review
        uses: actions/upload-artifact@v4
        with:
          name: invitation-20261109-flat-editorial-screenshots
          path: artifacts/store-refresh/ko-KR/
          retention-days: 30
      - name: Authenticate Google Play using short-lived Workload Identity token
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Upload only ko-KR phoneScreenshots within transactional Play edit
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: python scripts/publish-play-screenshots.py --assets artifacts/store-refresh/ko-KR --publish
      - name: Preserve upload report, including previous image IDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-ko-kr-phone-screenshots-upload-report
          path: artifacts/play-store-screenshots/report.json
          if-no-files-found: warn
          retention-days: 30
