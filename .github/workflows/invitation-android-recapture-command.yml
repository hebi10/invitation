name: Invitation Android UI recapture request

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write

jobs:
  dispatch-captures:
    if: >-
      github.repository == 'hebi10/invitation' &&
      github.event.issue.number == 30 &&
      github.event.comment.user.login == 'hebi10' &&
      github.event.comment.body == '/capture-invitation-android'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Start fresh Android emulator capture from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/mobile-captures.yml/dispatches" -f ref=main
          echo 'Requested source-accurate Android UI captures. No Play Store images or releases were changed.' >> "$GITHUB_STEP_SUMMARY"
