name: Invitation 0-A original intro animation captures

on:
  push:
    branches:
      - audit/invitation-intro-0a-20261109
    paths:
      - .github/workflows/invitation-intro-0a-capture.yml
      - scripts/qa-wedding-intro-baseline.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-original-intros:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned browser and image tooling
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Capture deployed preview intro frames without mutations
        env:
          INVITATION_INTRO_BASE_URL: https://invite.msgnote.kr
        run: python scripts/qa-wedding-intro-baseline.py
      - name: Upload original baseline screenshots and verification manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-original-intros-0a-20261109
          path: artifacts/invitation-intro-0a/
          retention-days: 30
          if-no-files-found: warn
