name: Capture approved mobile wedding theme previews

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/invitation-sample-preview-capture.yml
      - scripts/capture-clean-wedding-previews.mjs
      - apps/mobile/assets/theme-previews/*.jpg

permissions:
  contents: read

jobs:
  sample-previews:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install project and pinned browser
        run: |
          npm ci
          npm install --no-save --no-package-lock playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Capture and verify five approved theme previews
        run: node scripts/capture-clean-wedding-previews.mjs
      - name: Check that the app bundles the verified sample previews
        if: github.event_name == 'pull_request'
        run: |
          for theme in simple classic-r romantic gyeol emotional; do
            cmp "artifacts/theme-previews/$theme.jpg" "apps/mobile/assets/theme-previews/$theme.jpg"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-approved-wedding-theme-previews
          path: artifacts/theme-previews/
          retention-days: 30
          if-no-files-found: warn
