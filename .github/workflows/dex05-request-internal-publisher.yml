name: DEX-05 request existing verified internal publisher

on:
  push:
    branches:
      - ops/dex05-internal-30911

permissions:
  actions: write
  contents: read

concurrency:
  group: dex05-approved-internal-30911
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Request only the existing guarded OPS-04 publisher on exact main
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: '3c77af3299263e56e64dfa9ba5b93cbdc96c5cd9'
          APPROVED_INPUTS: '{"mode":"publish","expected_main_sha":"3c77af3299263e56e64dfa9ba5b93cbdc96c5cd9","build_run_id":"45977379508","artifact_name":"invitation-1.0.5-code30911-3c77af329926-signed","aab_sha256":"9ad05020e5df6f922f4b3ed135520646d4519daff643edc0d5d407388d15367c","version_code":"30911","version_name":"1.0.5","batch_id":"2026-11-27-invitation","final_release_approved":"true","approval_phrase":"PUBLISH_VERIFIED_INTERNAL_AAB"}'
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/ops/dex05-internal-30911'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SHA"
          existing="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/play-internal-release.yml/runs" --method GET -f branch=main -f event=workflow_dispatch -f "head_sha=$RELEASE_SHA" --jq .total_count)"
          if [[ "$existing" != "0" ]]; then
            echo "::error::An OPS-04 run already exists for this source. Inspect its result before retrying."
            exit 1
          fi
          printf '%s' "$APPROVED_INPUTS" | gh workflow run play-internal-release.yml --repo "$GITHUB_REPOSITORY" --ref main --json
          echo "Requested the existing OPS-04 internal publisher with the verified build and digest."
