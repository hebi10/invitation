name: Invitation 2-A Quiet web intro actual browser QA

on:
  push:
    branches:
      - feat/invitation-quiet-intro-2a-20261109
    paths:
      - src/components/sections/WeddingIntro/**
      - src/lib/weddingIntro.ts
      - scripts/qa-wedding-intro-web-2a.py
      - .github/workflows/invitation-intro-2a-web-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  react-web-intro:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Next.js project dependencies
        run: npm ci
      - name: Install pinned Chromium and screenshot dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0 pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Start local Next.js preview without Firebase credentials
        env:
          NEXT_PUBLIC_USE_FIREBASE: 'false'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
          NODE_ENV: development
        run: |
          nohup npm run dev > "$RUNNER_TEMP/intro-next-dev.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/intro-next-dev.pid"
          python - <<'PY'
          import time,urllib.request
          url="http://127.0.0.1:3000/mobile-intro-preview/?style=light"
          for attempt in range(100):
              try:
                  with urllib.request.urlopen(url,timeout=8) as response:
                      if response.status==200:
                          print("Local preview ready", response.status)
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Local Next.js preview did not return HTTP 200 in time")
          PY
      - name: Capture and test 3 real React intro styles
        env:
          INVITATION_INTRO_QA_BASE_URL: http://127.0.0.1:3000
        run: python scripts/qa-wedding-intro-web-2a.py
      - name: Upload read-only QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-quiet-intro-2a-react-qa
          path: artifacts/quiet-invitation-2a/
          retention-days: 30
          if-no-files-found: warn
      - name: On failure output a limited local server tail
        if: failure()
        run: tail -100 "$RUNNER_TEMP/intro-next-dev.log" || true
