name: Invitation UI-R08-VISUAL-05 final five-theme screen and functional QA

on:
  pull_request:
    paths:
      - src/app/sample-invitation/**
      - src/app/_components/public-invitations/wedding/**
      - src/app/_components/WeddingClosing.*
      - src/components/sections/Gallery/**
      - src/components/sections/Guestbook/**
      - src/components/sections/GiftInfo/**
      - scripts/qa-invitation-ui-r08-visual05.py
      - .github/workflows/invitation-ui-r08-visual05-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-five-theme-visual-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Next.js and Chromium
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Start development-only synthetic wedding preview without production credentials
        env:
          NEXT_PUBLIC_USE_FIREBASE: 'false'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          nohup npm run dev > "$RUNNER_TEMP/ui-r08-visual05-next.log" 2>&1 &
          python - <<'PY'
          import time
          import urllib.request
          url = "http://127.0.0.1:3000/sample-invitation/?qaTheme=simple&qaUI07=1&embed=1"
          for _ in range(110):
              try:
                  with urllib.request.urlopen(url, timeout=12) as response:
                      if response.status == 200:
                          print("UI-R08-VISUAL-05 synthetic fixture available", flush=True)
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Final visual QA sample route unavailable")
          PY
      - name: Verify all five designs, six viewport widths, conditional data and interactions
        env:
          INVITATION_R08_BASE: http://127.0.0.1:3000
        run: python scripts/qa-invitation-ui-r08-visual05.py
      - name: Upload all full-page screenshots, section captures and SHA256 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-ui-r08-visual05-final-qa-evidence
          path: artifacts/ui-r08-visual05/
          retention-days: 30
          if-no-files-found: warn
      - name: Show isolated Next.js diagnostics on failure
        if: failure()
        run: tail -120 "$RUNNER_TEMP/ui-r08-visual05-next.log" || true
