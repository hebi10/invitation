name: Invitation INTRO-GIF-03-D 12-preset integration QA

on:
  pull_request:
    paths:
      - 'src/lib/invitationIntroCatalog.ts'
      - 'src/lib/publicInvitationIntro.ts'
      - 'src/lib/invitationPagePersistence.ts'
      - 'src/components/sections/InvitationIntro/**'
      - 'src/app/page-wizard/**'
      - 'src/app/mobile-gif-intro-preview/**'
      - 'apps/mobile/src/features/**'
      - 'apps/mobile/src/lib/**'
      - 'apps/mobile/src/types/mobileInvitation.ts'
      - 'src/server/invitationPageServerService.ts'
      - 'src/app/api/**'
      - 'scripts/test-invitation-intro-03d.mts'
      - 'scripts/qa-invitation-intro-gif-03d.py'
      - '.github/workflows/invitation-intro-gif-03d-integration-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-picker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install web, mobile and Chromium dependencies
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Check shared Next.js and Expo Android TypeScript
        run: npm run typecheck
      - name: Test every preset, stored ID, event scope and SHA-256
        run: |
          python scripts/verify-intro-gif-03c.py
          node scripts/run-test-suite.mjs test-invitation-intro-catalog
          node scripts/run-test-suite.mjs test-invitation-intro-02b-pc
          node scripts/run-test-suite.mjs test-invitation-intro-02c-android
          node scripts/run-test-suite.mjs test-invitation-intro-02d-public
          node scripts/run-test-suite.mjs test-invitation-intro-03d
      - name: Launch isolated development-only customer picker
        env:
          NEXT_PUBLIC_USE_FIREBASE: 'false'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          nohup npm run dev > "$RUNNER_TEMP/intro-03d-server.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          url='http://127.0.0.1:3000/intro-catalog-editor-qa/'
          for _ in range(95):
              try:
                  with urllib.request.urlopen(url, timeout=12) as response:
                      if response.status == 200:
                          print('intro 03-D fixture ready')
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit('INTRO-03-D preview did not become ready')
          PY
      - name: Chromium 5-event, 3-viewport selection, preview and public-route QA
        run: python scripts/qa-invitation-intro-gif-03d.py
      - name: Upload screenshots and SHA256 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-intro-gif-03d-integrated-qa
          path: artifacts/intro-gif-03d/
          if-no-files-found: warn
          retention-days: 30
      - name: Show Next development log on failure
        if: failure()
        run: tail -160 "$RUNNER_TEMP/intro-03d-server.log" || true
