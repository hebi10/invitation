name: Invitation UI-09-04 guestbook responsive and accessibility QA

on:
  pull_request:
    paths:
      - src/app/_components/public-invitations/wedding/**
      - src/components/sections/Guestbook/**
      - src/app/sample-invitation/**
      - scripts/qa-invitation-ui09-04.py
      - scripts/test-wedding-ui09-04.mts
      - scripts/run-test-suite.mjs
      - .github/workflows/invitation-ui09-04-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guestbook-five-theme-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Verify QA isolation contracts
        run: npx --yes tsx scripts/test-wedding-ui09-04.mts
      - name: Start fictional development-only sample
        env:
          NEXT_PUBLIC_USE_FIREBASE: 'false'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          nohup npm run dev > "$RUNNER_TEMP/invitation-ui09-04-next.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:3000/sample-invitation/?qaTheme=simple&qaUI07=1&embed=1"
          for _ in range(110):
              try:
                  with urllib.request.urlopen(url, timeout=12) as response:
                      if response.status == 200:
                          print("Fictional sample ready", flush=True)
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("UI-09-04 fictional sample did not start")
          PY
      - name: Verify 5 designs, 320-1440px, 200 percent zoom and keyboard pagination
        env:
          INVITATION_LOCAL_BASE: http://127.0.0.1:3000
        run: python scripts/qa-invitation-ui09-04.py
      - name: Upload screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-ui09-04-guestbook-a11y-evidence
          path: artifacts/ui-09-04/
          retention-days: 30
          if-no-files-found: warn
      - name: Print diagnostics on failure
        if: failure()
        run: tail -120 "$RUNNER_TEMP/invitation-ui09-04-next.log" || true
