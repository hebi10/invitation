name: Invitation P1 simple cover deployed Firebase visual verification

on:
  push:
    branches:
      - qa/invitation-simple-live-after-pr61-20261110
    paths:
      - scripts/qa-invitation-simple-p1-live-postmerge.py
      - .github/workflows/invitation-p1-live-after-pr61.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-simple-cover-and-other-four-themes:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Confirm new deployed paper, serif and image ratio on the public sample
        env:
          INVITATION_LIVE_BASE: https://invite.msgnote.kr/shin-minje-kim-hyunji
        run: python scripts/qa-invitation-simple-p1-live-postmerge.py
      - name: Upload actual public before/after evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-pr61-postmerge-simple-live-screenshots
          path: artifacts/invitation-simple-p1-live/
          retention-days: 30
          if-no-files-found: warn
