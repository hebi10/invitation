name: Android APK·AAB 빌드 및 Play 테스트

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 선택한 Play 테스트 트랙에 배포
        type: boolean
        default: false
      deploy_target:
        description: Play 배포 대상 (main 자동 배포는 항상 내부 테스트)
        type: choice
        default: internal
        options:
          - internal
          - closed
      closed_track:
        description: 비공개 테스트의 실제 API 트랙 ID (비우면 PLAY_CLOSED_TRACK 변수 사용)
        type: string
        required: false
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'src/lib/**'
      - 'src/contracts/**'
      - 'src/types/**'
      - 'package*.json'
      - 'scripts/*mobile*release*'
      - 'scripts/*mobile*play*'
      - 'scripts/test_publish_mobile_play.py'
      - 'scripts/verify-mobile-release.py'
      - 'scripts/test_verify_mobile_release.py'
      - '.github/workflows/mobile-release.yml'
  push:
    branches: [main, build/mobile-aab]
    paths:
      - 'apps/mobile/**'
      - 'src/lib/**'
      - 'src/contracts/**'
      - 'src/types/**'
      - 'package*.json'
      - 'scripts/*mobile*release*'
      - 'scripts/*mobile*play*'
      - 'scripts/test_publish_mobile_play.py'
      - 'scripts/verify-mobile-release.py'
      - 'scripts/test_verify_mobile_release.py'
      - '.github/workflows/mobile-release.yml'

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  play-access:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.PLAY_WORKLOAD_IDENTITY_PROVIDER != '' && vars.PLAY_SERVICE_ACCOUNT != '' && !(github.event_name == 'push' && vars.PLAY_AUTO_DEPLOY_ENABLED == 'true') && !(github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Google Play 단기 읽기 토큰 발급
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: WIF 및 내부 테스트 읽기 권한 확인
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          request = urllib.request.Request(
              "https://androidpublisher.googleapis.com/androidpublisher/v3/applications/kr.msgnote.mobileinvitation/tracks/internal/releases",
              headers={"Authorization": f"Bearer {os.environ['PLAY_ACCESS_TOKEN']}"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as error:
              try:
                  raise SystemExit(f"::error::Play 내부 테스트 읽기 권한 확인 실패 (HTTP {error.code}). WIF 및 Play Console 앱 권한을 확인하세요.") from None
              finally:
                  error.close()
          except (urllib.error.URLError, TimeoutError, ValueError):
              raise SystemExit("::error::Play 내부 테스트 읽기 응답을 확인하지 못했습니다.") from None
          if not isinstance(payload, dict) or not isinstance(payload.get("releases", []), list):
              raise SystemExit("::error::Play 내부 테스트 읽기 응답 형식이 올바르지 않습니다.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("WIF 인증 및 내부 테스트 트랙 읽기 권한을 확인했습니다. 배포나 Play edit는 생성하지 않았습니다.\n")
          PY

  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    defaults:
      run:
        working-directory: apps/mobile
        shell: bash
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_NO_DOTENV: '1'
    outputs:
      deploy: ${{ steps.policy.outputs.deploy }}
      target: ${{ steps.policy.outputs.target }}
      track: ${{ steps.policy.outputs.track }}
      status: ${{ steps.deployment.outputs.status }}
      signed: ${{ steps.signing.outputs.signed }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      base_name: ${{ steps.metadata.outputs.base_name }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      version_name: ${{ steps.metadata.outputs.version_name }}
      build_attempt: ${{ steps.metadata.outputs.build_attempt }}
      release_name: ${{ steps.metadata.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - name: 실행별 버전 및 배포 권한 확인
        id: policy
        working-directory: .
        env:
          PLAY_AUTO_DEPLOY_ENABLED: ${{ vars.PLAY_AUTO_DEPLOY_ENABLED }}
          INPUT_DEPLOY: ${{ inputs.deploy && 'true' || 'false' }}
          PLAY_DEPLOY_TARGET: ${{ inputs.deploy_target || 'internal' }}
          PLAY_CLOSED_TRACK: ${{ inputs.closed_track || vars.PLAY_CLOSED_TRACK }}
        run: node scripts/mobile-release-policy.mjs ci
      - name: main 서명 및 배포 설정 사전 확인
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: deployment
        env:
          DEPLOY_REQUESTED: ${{ steps.policy.outputs.deploy }}
          PLAY_SIGNING_TARGET: ${{ steps.policy.outputs.target }}
          PLAY_SIGNING_TRACK: ${{ steps.policy.outputs.track }}
          INVITATION_KEYSTORE_BASE64: ${{ secrets.INVITATION_KEYSTORE_BASE64 }}
          INVITATION_KEYSTORE_PASSWORD: ${{ secrets.INVITATION_KEYSTORE_PASSWORD }}
          INVITATION_KEY_ALIAS: ${{ secrets.INVITATION_KEY_ALIAS }}
          INVITATION_KEY_PASSWORD: ${{ secrets.INVITATION_KEY_PASSWORD }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY || secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
          PLAY_AUTO_DEPLOY_ENABLED: ${{ vars.PLAY_AUTO_DEPLOY_ENABLED }}
          INPUT_DEPLOY: ${{ inputs.deploy && 'true' || 'false' }}
          PLAY_DEPLOY_TARGET: ${{ steps.policy.outputs.target }}
          PLAY_CLOSED_TRACK: ${{ steps.policy.outputs.track }}
          PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: |
          bash ../../scripts/sign-mobile-release.sh --check
          if [[ "$DEPLOY_REQUESTED" == true ]]; then
            SIGNED=true node ../../scripts/mobile-release-policy.mjs validate-deploy
            if [[ -z "$PLAY_WORKLOAD_IDENTITY_PROVIDER" || -z "$PLAY_SERVICE_ACCOUNT" ]]; then
              echo '::error::PLAY_WORKLOAD_IDENTITY_PROVIDER 및 PLAY_SERVICE_ACCOUNT Variables를 등록하세요.'
              exit 1
            fi
          fi
      - name: 공통 의존성 설치
        working-directory: .
        run: npm ci --include=dev
      - name: 모바일 의존성 설치
        run: npm ci --include=dev
      - name: 현재 소스 전체 검사
        working-directory: .
        env:
          NODE_ENV: test
        run: |
          npm run check
          npm test
          test ! -e apps/mobile/src/app/design-check.tsx
      - name: main 운영 결제 공개 키 설정
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          REVENUECAT_PUBLIC_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY || secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
        run: |
          if [[ -n "$REVENUECAT_PUBLIC_KEY" ]]; then
            if [[ ! "$REVENUECAT_PUBLIC_KEY" =~ ^goog_[A-Za-z0-9]+$ ]]; then
              echo '::error::RevenueCat Google Play 공개 키 형식이 올바르지 않습니다.'
              exit 1
            fi
            printf 'EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY=%s\n' "$REVENUECAT_PUBLIC_KEY" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Android SDK 설치
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: Android 프로젝트 생성 및 메타데이터 검증
        id: metadata
        run: |
          npx --no-install expo prebuild --platform android --no-install
          node ../../scripts/mobile-release-policy.mjs prepare android/app/build.gradle
          printf 'build_attempt=%s\n' "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: gradle/actions/setup-gradle@v4
      - name: 미서명 APK 및 AAB 빌드
        env:
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          BASE_NAME: ${{ steps.metadata.outputs.base_name }}
        run: |
          timeout 40m bash android/gradlew -p android --no-daemon --max-workers=2 :app:assembleRelease :app:bundleRelease
          apk=android/app/build/outputs/apk/release/app-release-unsigned.apk
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          for file in "$apk" "$bundle"; do
            test -s "$file"
            unzip -t "$file" > /dev/null
            unzip -Z1 "$file" > "$RUNNER_TEMP/invitation-archive-entries.txt"
            if grep -Eiq '^META-INF/.*\.(RSA|DSA|EC)$' "$RUNNER_TEMP/invitation-archive-entries.txt"; then
              echo '::error::미서명 빌드에 예상하지 않은 서명이 있습니다.'
              exit 1
            fi
          done
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk" > /dev/null 2>&1; then
            echo '::error::미서명 APK에 예상하지 않은 APK 서명이 있습니다.'
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk" > "$RUNNER_TEMP/invitation-apk-badging.txt"
          grep -F "package: name='kr.msgnote.mobileinvitation'" "$RUNNER_TEMP/invitation-apk-badging.txt"
          grep -F "versionCode='$EXPO_ANDROID_VERSION_CODE'" "$RUNNER_TEMP/invitation-apk-badging.txt"
          grep -F "versionName='$VERSION_NAME'" "$RUNNER_TEMP/invitation-apk-badging.txt"
          mkdir -p "$RUNNER_TEMP/unsigned-mobile"
          cp "$apk" "$RUNNER_TEMP/unsigned-mobile/$BASE_NAME-unsigned.apk"
          cp "$bundle" "$RUNNER_TEMP/unsigned-mobile/$BASE_NAME-unsigned.aab"
      - name: 미서명 APK 및 AAB 보관
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.base_name }}-unsigned
          path: ${{ runner.temp }}/unsigned-mobile/*
          if-no-files-found: error
          retention-days: 14
      - name: 기존 청첩장 키로 APK 및 AAB 서명
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        id: signing
        env:
          BASE_NAME: ${{ steps.metadata.outputs.base_name }}
          DEPLOY_REQUESTED: ${{ steps.policy.outputs.deploy }}
          PLAY_SIGNING_TARGET: ${{ steps.policy.outputs.target }}
          PLAY_SIGNING_TRACK: ${{ steps.policy.outputs.track }}
          INVITATION_KEYSTORE_BASE64: ${{ secrets.INVITATION_KEYSTORE_BASE64 }}
          INVITATION_KEYSTORE_PASSWORD: ${{ secrets.INVITATION_KEYSTORE_PASSWORD }}
          INVITATION_KEY_ALIAS: ${{ secrets.INVITATION_KEY_ALIAS }}
          INVITATION_KEY_PASSWORD: ${{ secrets.INVITATION_KEY_PASSWORD }}
        run: bash ../../scripts/sign-mobile-release.sh
      - name: 고정 bundletool로 AAB 메타데이터 및 출처 검증
        if: steps.signing.outputs.signed == 'true'
        env:
          BASE_NAME: ${{ steps.metadata.outputs.base_name }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
        run: |
          curl --fail --location --retry 3 'https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar' --output "$RUNNER_TEMP/invitation-bundletool.jar"
          printf '%s  %s\n' 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29' "$RUNNER_TEMP/invitation-bundletool.jar" | sha256sum --check
          bundle="$RUNNER_TEMP/signed-mobile/$BASE_NAME.aab"
          java -jar "$RUNNER_TEMP/invitation-bundletool.jar" validate --bundle="$bundle"
          java -jar "$RUNNER_TEMP/invitation-bundletool.jar" dump manifest --bundle="$bundle" --module=base > "$RUNNER_TEMP/invitation-bundle-manifest.xml"
          python3 ../../scripts/verify-mobile-release.py stage --directory "$RUNNER_TEMP/signed-mobile" --base-name "$BASE_NAME" --manifest "$RUNNER_TEMP/invitation-bundle-manifest.xml" --version-name "$VERSION_NAME" --version-code "$EXPO_ANDROID_VERSION_CODE" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: 서명 APK 및 AAB 보관
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: ${{ runner.temp }}/signed-mobile/*
          if-no-files-found: error
          retention-days: 14
      - name: 빌드 출처 기록
        if: success()
        env:
          RELEASE_NAME: ${{ steps.metadata.outputs.release_name }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          DEPLOY_REQUESTED: ${{ steps.policy.outputs.deploy }}
        run: |
          printf '소스 커밋: %s\n패키지: kr.msgnote.mobileinvitation\n버전: %s\n' "$GITHUB_SHA" "$RELEASE_NAME" >> "$GITHUB_STEP_SUMMARY"
          printf '기존 키 서명: %s / Play 배포 요청: %s\n' "${SIGNED:-false}" "$DEPLOY_REQUESTED" >> "$GITHUB_STEP_SUMMARY"
          echo 'Expo 계정 로그인 없이 GitHub에서 직접 빌드했습니다. Play 설치본 업데이트는 Play 테스트 배포를 이용하세요.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: bundle
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.bundle.outputs.deploy == 'true'
    environment: google-play-testing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Google 인증 전 배포 정책 확인
        env:
          PLAY_AUTO_DEPLOY_ENABLED: ${{ vars.PLAY_AUTO_DEPLOY_ENABLED }}
          INPUT_DEPLOY: ${{ inputs.deploy && 'true' || 'false' }}
          SIGNED: ${{ needs.bundle.outputs.signed }}
          PLAY_DEPLOY_TARGET: ${{ needs.bundle.outputs.target }}
          PLAY_CLOSED_TRACK: ${{ needs.bundle.outputs.track }}
          PLAY_RELEASE_STATUS: ${{ needs.bundle.outputs.status }}
          PLAY_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: |
          node scripts/mobile-release-policy.mjs validate-deploy
          if [[ -z "$PLAY_WORKLOAD_IDENTITY_PROVIDER" || -z "$PLAY_SERVICE_ACCOUNT" ]]; then
            echo '::error::PLAY_WORKLOAD_IDENTITY_PROVIDER 및 PLAY_SERVICE_ACCOUNT Variables를 등록하세요.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.bundle.outputs.artifact_name }}
          path: play-artifacts
      - name: 동일 실행 서명 산출물 검사
        working-directory: play-artifacts
        run: sha256sum --check SHA256SUMS
      - name: 다운로드한 APK·AAB의 소스·버전·실행 재검증
        env:
          BASE_NAME: ${{ needs.bundle.outputs.base_name }}
          VERSION_NAME: ${{ needs.bundle.outputs.version_name }}
          VERSION_CODE: ${{ needs.bundle.outputs.version_code }}
          BUILD_ATTEMPT: ${{ needs.bundle.outputs.build_attempt }}
        run: python3 scripts/verify-mobile-release.py verify --directory play-artifacts --base-name "$BASE_NAME" --version-name "$VERSION_NAME" --version-code "$VERSION_CODE" --source-sha "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$BUILD_ATTEMPT"
      - name: Google Play 단기 액세스 토큰 발급
        id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: 검증한 Play 테스트 트랙 업데이트
        id: publish
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          VERSION_CODE: ${{ needs.bundle.outputs.version_code }}
          RELEASE_NAME: ${{ needs.bundle.outputs.release_name }}
          BASE_NAME: ${{ needs.bundle.outputs.base_name }}
          PLAY_TARGET: ${{ needs.bundle.outputs.target }}
          PLAY_TRACK: ${{ needs.bundle.outputs.track }}
          RELEASE_STATUS: ${{ needs.bundle.outputs.status }}
          PLAY_SEND_FOR_REVIEW: ${{ vars.PLAY_SEND_FOR_REVIEW }}
        run: |
          AAB="play-artifacts/$BASE_NAME.aab"
          test -s "$AAB"
          args=(--aab "$AAB" --version-code "$VERSION_CODE" --target "$PLAY_TARGET" --track "$PLAY_TRACK" --release-name "$RELEASE_NAME" --notes-file apps/mobile/store/ko-KR/release-notes.txt --status "$RELEASE_STATUS")
          if [[ "$PLAY_SEND_FOR_REVIEW" == true ]]; then args+=(--send-for-review); fi
          python3 scripts/publish-mobile-play.py "${args[@]}"
