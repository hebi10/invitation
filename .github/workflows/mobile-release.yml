name: Android AAB 빌드 및 업로드

on:
  workflow_dispatch:
    inputs:
      upload_to_play:
        description: Google Play 내부 테스트 초안으로 업로드 (EAS 제출 인증 필요)
        type: boolean
        default: false
  push:
    tags:
      - 'mobile-v*'

permissions:
  contents: read

concurrency:
  group: mobile-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/mobile
        shell: bash
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: EAS 인증 확인
        run: |
          if [[ -z "$EXPO_TOKEN" ]]; then
            echo '::error::Repository secret EXPO_TOKEN을 먼저 등록하세요. 기존 EAS 프로젝트의 Developer 이상 권한이 필요합니다.'
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: 27.3.0
          token: ${{ secrets.EXPO_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 공통 의존성 설치
        working-directory: .
        run: npm ci
      - name: 모바일 의존성 설치
        run: npm ci
      - name: 모바일 정적 검증
        run: |
          npm run lint
          npm run typecheck
          test ! -e src/app/design-check.tsx
      - name: 기존 원격 Android 서명 키 확인
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://api.expo.dev/graphql', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              Authorization: `Bearer ${process.env.EXPO_TOKEN}`,
            },
            signal: AbortSignal.timeout(30000),
            body: JSON.stringify({
              query: `query ExistingAndroidSigning {
                app { byFullName(fullName: "@hebi96/mobile-invitation-app") {
                  id
                  androidAppCredentials(filter: {
                    applicationIdentifier: "kr.msgnote.mobileinvitation", legacyOnly: false
                  }) {
                    applicationIdentifier
                    androidAppBuildCredentialsList {
                      isDefault
                      androidKeystore { id }
                    }
                  }
                } }
              }`,
            }),
          });
          if (!response.ok) throw new Error('기존 Android 서명 설정을 확인할 수 없습니다.');
          const { data, errors } = await response.json();
          const project = data?.app?.byFullName;
          const credentials = project?.androidAppCredentials?.flatMap(app =>
            app.applicationIdentifier === 'kr.msgnote.mobileinvitation'
              ? app.androidAppBuildCredentialsList.filter(item => item.isDefault && item.androidKeystore?.id)
              : []) ?? [];
          if (errors?.length || project?.id !== '6bc60acb-c565-4be9-99f2-56ba7ae40a7c' || credentials.length !== 1) {
            throw new Error('기존 기본 Android 서명 키가 확인되지 않아 중단합니다. 새 키를 생성하지 마세요.');
          }
          console.log('기존 프로젝트와 기본 Android 서명 키 연결 확인 완료 (키 값 조회 없음).');
          JS
      - name: 기존 Play 버전보다 높은 빌드 번호 확인
        run: |
          eas build:version:get --platform android --profile production --non-interactive --json > "$RUNNER_TEMP/eas-version.json"
          if ! jq -e '(.versionCode | tonumber) >= 8' "$RUNNER_TEMP/eas-version.json" > /dev/null; then
            echo '::error::EAS 원격 Android versionCode를 기존 Play 업로드 번호(8) 이상으로 맞추세요. production에서 다음 번호로 자동 증가합니다.'
            exit 1
          fi
      - name: 기존 서명 키로 production AAB 빌드
        run: |
          eas build --platform android --profile production --non-interactive --freeze-credentials --wait --json > "$RUNNER_TEMP/eas-build.json"
      - name: 완료된 AAB 다운로드
        id: bundle
        run: |
          jq -e 'length == 1 and .[0].platform == "ANDROID" and .[0].status == "FINISHED" and (.[0].appBuildVersion | tonumber) > 8' "$RUNNER_TEMP/eas-build.json" > /dev/null
          build_id=$(jq -er '.[0].id' "$RUNNER_TEMP/eas-build.json")
          bundle_url=$(jq -er '.[0].artifacts.buildUrl' "$RUNNER_TEMP/eas-build.json")
          mkdir -p "$RUNNER_TEMP/mobile-release"
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' "$bundle_url" -o "$RUNNER_TEMP/mobile-release/invitation.aab"
          unzip -t "$RUNNER_TEMP/mobile-release/invitation.aab" > /dev/null
          test -n "$(unzip -Z1 "$RUNNER_TEMP/mobile-release/invitation.aab" | sed -n '/^META-INF\/.*\.RSA$/p;/^META-INF\/.*\.DSA$/p;/^META-INF\/.*\.EC$/p')"
          jarsigner -verify "$RUNNER_TEMP/mobile-release/invitation.aab"
          echo "build_id=$build_id" >> "$GITHUB_OUTPUT"
          echo "### Android AAB" >> "$GITHUB_STEP_SUMMARY"
          echo "- 소스: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- EAS 빌드: https://expo.dev/accounts/hebi96/projects/mobile-invitation-app/builds/$build_id" >> "$GITHUB_STEP_SUMMARY"
          echo '- AAB는 이 실행의 Artifacts에서 다운로드할 수 있습니다.' >> "$GITHUB_STEP_SUMMARY"
      - name: 서명된 AAB 보관
        uses: actions/upload-artifact@v4
        with:
          name: invitation-android-${{ github.run_number }}
          path: ${{ runner.temp }}/mobile-release/invitation.aab
          if-no-files-found: error
          retention-days: 14
      - name: Google Play 내부 테스트 초안 업로드
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_play }}
        env:
          BUILD_ID: ${{ steps.bundle.outputs.build_id }}
        run: |
          eas submit --platform android --profile production --id "$BUILD_ID" --non-interactive --wait
          echo '- Play Console 내부 테스트 초안 업로드 완료 (공개 출시 전).' >> "$GITHUB_STEP_SUMMARY"
