name: Android AAB 빌드

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-release.yml'
  push:
    branches: [main, build/mobile-aab]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile-release.yml'

permissions:
  contents: read

concurrency:
  group: mobile-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
        shell: bash
    env:
      CI: '1'
      NODE_ENV: production
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY || secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Android SDK 설치
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
      - name: 공통 의존성 설치
        working-directory: .
        run: npm ci --include=dev
      - name: 모바일 의존성 설치 및 검증
        run: |
          npm ci --include=dev
          npm run lint
          npm run typecheck
          test ! -e src/app/design-check.tsx
      - name: Android 프로젝트 생성 및 릴리스 디버그 서명 해제
        run: |
          npx --no-install expo prebuild --platform android --no-install
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const path = 'android/app/build.gradle';
          const gradle = readFileSync(path, 'utf8');
          if (!gradle.includes("applicationId 'kr.msgnote.mobileinvitation'") || !/versionCode\s+9\b/.test(gradle)) {
            throw new Error('청첩장 앱 식별자 또는 버전 번호 불일치');
          }
          appendFileSync(path, '\nandroid { buildTypes { release { signingConfig null } } }\n');
          JS
      - uses: gradle/actions/setup-gradle@v4
      - name: GitHub에서 미서명 AAB 빌드
        run: |
          timeout 40m bash android/gradlew -p android --no-daemon --max-workers=2 :app:bundleRelease
          bundle=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$bundle"
          unzip -t "$bundle" > /dev/null
          unzip -Z1 "$bundle" > "$RUNNER_TEMP/invitation-bundle-entries.txt"
          if grep -Eiq '^META-INF/.*\.(RSA|DSA|EC)$' "$RUNNER_TEMP/invitation-bundle-entries.txt"; then
            echo '::error::미서명 빌드에 예상하지 않은 서명이 있습니다.'
            exit 1
          fi
      - name: 미서명 AAB 보관
        uses: actions/upload-artifact@v4
        with:
          name: invitation-1.0.4-code9-unsigned
          path: apps/mobile/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - name: 기존 청첩장 키로 서명 (인증 정보가 있을 때)
        if: github.event_name != 'pull_request'
        id: signing
        env:
          INVITATION_KEYSTORE_BASE64: ${{ secrets.INVITATION_KEYSTORE_BASE64 }}
          INVITATION_KEYSTORE_PASSWORD: ${{ secrets.INVITATION_KEYSTORE_PASSWORD }}
          INVITATION_KEY_ALIAS: ${{ secrets.INVITATION_KEY_ALIAS }}
          INVITATION_KEY_PASSWORD: ${{ secrets.INVITATION_KEY_PASSWORD }}
        run: |
          configured=0
          for name in INVITATION_KEYSTORE_BASE64 INVITATION_KEYSTORE_PASSWORD INVITATION_KEY_ALIAS INVITATION_KEY_PASSWORD; do
            if [[ -n "${!name}" ]]; then configured=$((configured + 1)); fi
          done
          if [[ "$configured" -eq 0 ]]; then
            echo '서명 인증 정보 없음: 미서명 AAB만 보관했습니다. Play에 업로드하려면 청첩장 앱의 기존 업로드 키로 서명해야 합니다.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ "$configured" -ne 4 ]]; then
            echo '::error::청첩장 서명 Secrets 4개를 모두 등록하거나 모두 비워 두세요.'
            exit 1
          fi
          if [[ "$EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY" != goog_* ]]; then
            echo '::error::운영 RevenueCat Google Play 공개 키가 없어 배포용 서명을 중단합니다.'
            exit 1
          fi
          umask 077
          signing_store="$RUNNER_TEMP/invitation-upload-keystore"
          trap 'rm -f "$signing_store"' EXIT
          printf '%s' "$INVITATION_KEYSTORE_BASE64" | base64 --decode > "$signing_store"
          mkdir -p "$RUNNER_TEMP/signed-mobile"
          jarsigner -keystore "$signing_store" -storepass:env INVITATION_KEYSTORE_PASSWORD -keypass:env INVITATION_KEY_PASSWORD \
            -signedjar "$RUNNER_TEMP/signed-mobile/invitation-1.0.4-code9.aab" \
            android/app/build/outputs/bundle/release/app-release.aab "$INVITATION_KEY_ALIAS"
          jarsigner -verify "$RUNNER_TEMP/signed-mobile/invitation-1.0.4-code9.aab"
          echo 'signed=true' >> "$GITHUB_OUTPUT"
          echo '기존 청첩장 업로드 키로 서명된 AAB를 보관했습니다. Play 업로드·출시는 별도 단계입니다.' >> "$GITHUB_STEP_SUMMARY"
      - name: 서명된 AAB 보관
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: invitation-1.0.4-code9-signed
          path: ${{ runner.temp }}/signed-mobile/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: 빌드 출처 기록
        if: success()
        run: |
          echo "소스 커밋: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '패키지: kr.msgnote.mobileinvitation / 버전: 1.0.4 (9)' >> "$GITHUB_STEP_SUMMARY"
          echo 'Expo 계정 로그인과 EXPO_TOKEN 없이 GitHub에서 직접 빌드했습니다.' >> "$GITHUB_STEP_SUMMARY"
