name: Invitation P1 photo classic and music visual QA

on:
  pull_request:
    paths:
      - src/app/_components/public-invitations/wedding/WeddingGallery.module.css
      - src/app/_components/public-invitations/wedding/WeddingCover.module.css
      - src/app/_components/public-invitations/wedding/WeddingBase.module.css
      - src/components/media/BackgroundMusic.module.css
      - src/components/media/BackgroundMusic.tsx
      - src/app/_components/EventInvitationPage.tsx
      - src/app/sample-invitation/**
      - scripts/qa-invitation-p1-photo-classic-music.py
      - scripts/test-wedding-p1-photo-classic-music.mts
      - .github/workflows/invitation-p1-photo-classic-music-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p1-actual-nextjs-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate public wedding layout contracts
        run: |
          npx --no-install tsx scripts/test-wedding-p1-photo-classic-music.mts
          npx --no-install tsx scripts/test-wedding-simple-p1-and-sample-p0.mts
      - name: Start isolated fictional local sample without Firebase credentials
        env:
          NEXT_PUBLIC_USE_FIREBASE: 'false'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          nohup npm run dev > "$RUNNER_TEMP/invitation-p1-next.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:3000/sample-invitation/?qaTheme=romantic&qaMusic=1"
          for _ in range(100):
              try:
                  with urllib.request.urlopen(url, timeout=10) as response:
                      if response.status == 200:
                          print("Isolated sample ready", flush=True)
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Fictional sample unavailable")
          PY
      - name: Capture 8 actual React and CSS viewports
        env:
          INVITATION_LOCAL_BASE: http://127.0.0.1:3000
        run: python scripts/qa-invitation-p1-photo-classic-music.py
      - name: Preserve screenshot and SHA256 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-p1-photo-classic-music-actual-qa
          path: artifacts/invitation-p1-photo-classic-music/
          retention-days: 30
          if-no-files-found: warn
      - name: Print server log tail on failure
        if: failure()
        run: tail -100 "$RUNNER_TEMP/invitation-p1-next.log" || true
