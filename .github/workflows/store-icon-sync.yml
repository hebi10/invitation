name: Play 스토어 대표 아이콘 동기화

on:
  workflow_dispatch:
    inputs:
      ops01_release_approved:
        description: 'Approve Play changes only after final release batch and QA'
        type: boolean
        required: true
        default: false
      apply:
        description: "현재 앱의 ko-KR 아이콘을 Play 등록정보에 실제 적용"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mobile-android-release
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'hebi10/invitation' &&
      github.event.issue.number == 30 &&
      github.event.comment.user.login == 'hebi10' &&
      github.event.comment.body == '/upload-invitation-icon-20261109'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch trusted main-only icon update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/store-icon-sync.yml/dispatches" \
            -f ref=main -f 'inputs[apply]=true'
  store-icon:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.repository == 'hebi10/invitation' && github.ref == 'refs/heads/main' && github.event_name != 'issue_comment')
    runs-on: ubuntu-24.04
    environment: google-play-testing
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: OPS-01 require manual approval for icon upload
        if: inputs.apply == true
        env:
          OPS01_RELEASE_APPROVED: ${{ inputs.ops01_release_approved }}
        run: test "$OPS01_RELEASE_APPROVED" = true
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 평면형 웨딩 아이콘 생성 및 픽셀 출처 검증
        run: |
          python -m pip install Pillow==12.3.0
          python scripts/build-store-rebrand.py --icon-only
          test -s apps/mobile/store/icon.png
      - name: Google Play 전용 계정 설정 확인
        env:
          WORKLOAD_IDENTITY_PROVIDER: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        run: |
          test -n "$WORKLOAD_IDENTITY_PROVIDER" || { echo '::error::PLAY_WORKLOAD_IDENTITY_PROVIDER가 필요합니다.'; exit 1; }
          test -n "$PLAY_SERVICE_ACCOUNT" || { echo '::error::PLAY_SERVICE_ACCOUNT가 필요합니다.'; exit 1; }
      - name: Google Play OAuth 단기 토큰 발급
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.PLAY_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: ko-KR 대표 아이콘 확인 및 필요한 경우 갱신
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          APPLY_MANUAL: ${{ inputs.apply && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$APPLY_MANUAL" == "true" ]]; then
            python3 scripts/sync-play-store-icon.py --apply
          else
            python3 scripts/sync-play-store-icon.py
          fi
