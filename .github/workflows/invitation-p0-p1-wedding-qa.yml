name: Invitation P0 sample integrity and P1 simple cover visual QA

on:
  push:
    branches:
      - feat/invitation-p0-p1-sample-audit-simple-cover-20261110
    paths:
      - src/app/_components/public-invitations/wedding/WeddingCover.module.css
      - scripts/qa-invitation-p0-sample-integrity.py
      - scripts/qa-invitation-simple-cover-p1.py
      - scripts/test-wedding-simple-p1-and-sample-p0.mts
      - .github/workflows/invitation-p0-p1-wedding-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-public-sample-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Read-only public sample data audit for five themes
        env:
          INVITATION_PUBLIC_SAMPLE_BASE: https://invite.msgnote.kr/shin-minje-kim-hyunji
        run: python scripts/qa-invitation-p0-sample-integrity.py
      - name: Preserve redacted public data audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-p0-public-sample-integrity
          path: artifacts/invitation-p0-sample-integrity/
          retention-days: 30
          if-no-files-found: warn

  p1-simple-cover-actual-rendering:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and Chromium
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run P0 sample and P1 CSS regression
        run: npx --no-install tsx scripts/test-wedding-simple-p1-and-sample-p0.mts
      - name: Start local Next.js without Firebase credentials
        env:
          NEXT_PUBLIC_USE_FIREBASE: 'false'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          nohup npm run dev > "$RUNNER_TEMP/invitation-simple-p1-next.log" 2>&1 &
          python - <<'PY'
          import time,urllib.request
          url="http://127.0.0.1:3000/sample-invitation/"
          for _ in range(100):
              try:
                  with urllib.request.urlopen(url,timeout=10) as r:
                      if r.status==200:
                          print("Local sample ready",flush=True)
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Local no-Firebase sample route unavailable")
          PY
      - name: Screenshot real React simple cover and assert metrics
        env:
          INVITATION_LOCAL_BASE: http://127.0.0.1:3000
        run: python scripts/qa-invitation-simple-cover-p1.py
      - name: Upload rendered screenshots and sizes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-p1-simple-cover-real-qa
          path: artifacts/invitation-p1-simple-cover/
          retention-days: 30
          if-no-files-found: warn
      - name: Print safe server tail on failure
        if: failure()
        run: tail -90 "$RUNNER_TEMP/invitation-simple-p1-next.log" || true
