name: Invitation UI-07-F integrated browser and Android emulator QA

on:
  pull_request:
    paths:
      - src/app/sample-invitation/**
      - src/components/sections/WeddingIntro/**
      - src/components/media/BackgroundMusic.*
      - src/app/_components/public-invitations/wedding/**
      - scripts/qa-invitation-ui07-f-browser.py
      - scripts/qa-invitation-ui07-f-android.py
      - scripts/test-wedding-ui07-f.mts
      - scripts/run-test-suite.mjs
      - .github/workflows/invitation-ui07-f-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-five-theme-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frontend dependencies and Chromium
        run: |
          npm ci
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Run F integration/static privacy guard
        run: node scripts/run-test-suite.mjs test-wedding-ui07-f
      - name: Serve fictional sample without Firebase credentials
        env:
          NEXT_PUBLIC_USE_FIREBASE: 'false'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          nohup npm run dev > "$RUNNER_TEMP/ui07-f-next.log" 2>&1 &
          python - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:3000/sample-invitation/?qaTheme=simple&qaUI07=1&qaUI07Case=full&qaUI07Map=coordinates&qaMusic=1&embed=1"
          for _ in range(110):
              try:
                  with urllib.request.urlopen(url, timeout=12) as response:
                      if response.status == 200:
                          print("UI-07-F fictional integration fixture ready", flush=True)
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("UI-07-F synthetic sample not ready")
          PY
      - name: Preflight first integrated browser case
        env:
          INVITATION_UI07F_BASE: http://127.0.0.1:3000
          INVITATION_UI07F_LIMIT: '1'
        run: python scripts/qa-invitation-ui07-f-browser.py
      - name: Validate 5-theme cross-feature flow, intro-to-cover, edges and text scaling
        env:
          INVITATION_UI07F_BASE: http://127.0.0.1:3000
        run: python scripts/qa-invitation-ui07-f-browser.py
      - name: Store browser screenshots and SHA256 manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-ui07-f-integrated-browser
          path: artifacts/ui-07-f/browser/
          retention-days: 30
          if-no-files-found: warn
      - name: Print local app diagnostics on failure
        if: failure()
        run: tail -90 "$RUNNER_TEMP/ui07-f-next.log" || true

  android-api35-chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install app dependencies and screenshot comparison tools
        run: |
          npm ci
          python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Serve isolated fictional sample for Android emulator
        env:
          NEXT_PUBLIC_USE_FIREBASE: 'false'
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          nohup npm run dev > "$RUNNER_TEMP/ui07-f-android-next.log" 2>&1 &
          python3 - <<'PY'
          import time, urllib.request
          url = "http://127.0.0.1:3000/sample-invitation/?qaTheme=simple&qaUI07=1&embed=1"
          for _ in range(110):
              try:
                  with urllib.request.urlopen(url, timeout=12) as response:
                      if response.status == 200:
                          print("UI-07-F fictional Android fixture ready", flush=True)
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Android emulator fixture not ready")
          PY
      - name: Configure hosted Android KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android API35 Chrome five-theme font-scale screenshots and native hierarchy
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 3072M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 scripts/qa-invitation-ui07-f-android.py
      - name: Save Android emulator screenshots, UI hierarchy and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invitation-ui07-f-android-api35-emulated-not-physical
          path: artifacts/ui-07-f/android-api35/
          retention-days: 30
          if-no-files-found: warn
      - name: Print Next diagnostics on failure
        if: failure()
        run: tail -90 "$RUNNER_TEMP/ui07-f-android-next.log" || true
