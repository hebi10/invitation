name: One-time Invitation direct billing lockfile refresh

on:
  push:
    branches:
      - feat/invitation-direct-google-play-billing-20261108

permissions:
  contents: write

concurrency:
  group: invitation-billing-lock-refresh
  cancel-in-progress: false

jobs:
  lockfiles:
    if: github.repository == 'hebi10/invitation'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/invitation-direct-google-play-billing-20261108
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild existing npm lockfiles for direct Google Play SDK
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix apps/mobile --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --check
      - name: Commit lockfiles only to feature branch
        run: |
          git add package-lock.json apps/mobile/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(billing): refresh npm locks for direct Play Billing SDK'
          git push origin HEAD:feat/invitation-direct-google-play-billing-20261108
